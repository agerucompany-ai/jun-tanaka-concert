<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>サイトの更新｜田中純 公式サイト</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>/* Layout: チラシの「水色の空→夜の紺」。本文は左、右に次の公演と申込欄を貼りつける（スマホは本文の下＋画面下の申込ボタン） */
:root{
  --sky:#dff1f1; --sky-ink:#1d3d63; --night:#12223f; --night-line:#2b4064; --night-ink:#e8eef6; --night-accent:#bfe6e9;
  --bg:#f6f9fa; --fg:#1a2433; --muted:#5a6878; --line:#d3dde3; --accent:#2f7f86; --on-accent:#ffffff; --card:#ffffff; --err:#b3261e;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --sky:#16314a; --sky-ink:#d8ecf0; --bg:#0e1828; --fg:#e4ebf2; --muted:#9fb0c2; --line:#2a3a52; --accent:#6cc2c8; --on-accent:#0b1a2b; --card:#15233a; --err:#ffb4ab; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.8}
img{max-width:100%;height:auto;display:block}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;font-weight:700;line-height:1.4}
p{margin:0}
a{color:var(--accent)}
.note{font-size:.9rem;color:var(--muted)}
.eyebrow{font-size:.9rem;letter-spacing:.08em;color:var(--accent);font-weight:500}

/* nav */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.35rem;font-weight:700;color:var(--sky-ink);text-decoration:none;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--body);font-size:.75rem;letter-spacing:.1em;color:var(--muted);font-weight:400}
.links{display:flex;gap:16px;flex-wrap:wrap;font-size:.92rem}
.links a{color:var(--fg);text-decoration:none}
.links a:hover{color:var(--accent)}

/* hero */
.hero{background:linear-gradient(180deg,var(--sky) 0%,var(--bg) 100%)}
.herogrid{display:grid;gap:24px;padding-block:32px 40px;align-items:center}
.hero h1{font-size:clamp(2.6rem,9vw,4.4rem);color:var(--sky-ink);letter-spacing:.06em}
.hero .h1c{font-size:clamp(1.8rem,6vw,2.8rem);letter-spacing:0}
.hero .tag{margin-top:12px;font-size:1.1rem;color:var(--sky-ink)}
.hero img{border-radius:6px;width:100%;aspect-ratio:880/580;object-fit:cover}
@media (min-width:860px){.herogrid{grid-template-columns:1fr 1.15fr}}

/* layout: 本文＋申込 */
.layout{display:grid;gap:32px;padding-block:8px 48px}
.layout main{min-width:0;display:grid;gap:0}
@media (min-width:960px){
  .layout{grid-template-columns:minmax(0,1fr) 380px;gap:48px;align-items:start}
  .side{position:sticky;top:72px;max-height:calc(100vh - 88px);overflow:auto}
  .mbar{display:none!important}
}

.block{padding-block:40px;border-bottom:1px solid var(--line);display:grid;gap:16px}
.block h2{font-size:clamp(1.5rem,4.6vw,2rem)}
.block .sub{font-size:1.15rem;margin-top:12px}
.lead{font-size:1.05rem}
.gift,.acts{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.gift li,.acts li{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:grid;gap:4px}
.gift h3,.acts h3{font-size:1.15rem}
.more{font-weight:500}
.more::after{content:" →"}

.night{background:var(--night);color:var(--night-ink);border-bottom:0;border-radius:10px;padding:32px 22px;margin-block:24px}
.night h2{color:#fff}
.night .more{color:var(--night-accent)}
.bio{line-height:2}
.creds{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.creds li{display:grid;grid-template-columns:7.5em 1fr;gap:12px;border-bottom:1px solid var(--night-line);padding-bottom:10px}
.creds b{font-family:var(--display);color:var(--night-accent)}
.price{font-family:var(--display);font-size:clamp(1.25rem,4vw,1.55rem);line-height:1.6;color:#fff}
.price em{font-style:normal;color:var(--night-accent)}
.songs{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.songs li{display:grid;grid-template-columns:6.5em 1fr;gap:10px}

.faq{display:grid;gap:12px}
.faq h4{margin:0;font-size:1rem}
.list{padding-left:1.2em;margin:0;display:grid;gap:6px}
details summary{cursor:pointer;color:var(--accent);font-weight:500}

.video{position:relative;display:block;border-radius:8px;overflow:hidden}
.video img{width:100%;aspect-ratio:16/9;object-fit:cover}
.video .play{position:absolute;inset:0;margin:auto;width:72px;height:72px;border-radius:50%;background:rgba(18,34,63,.78);color:#fff;display:grid;place-items:center;font-size:28px;padding-left:5px}
@media (max-width:480px){.creds li,.songs li{grid-template-columns:1fr;gap:2px}}

/* 申込カード */
.card{background:var(--sky);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:10px}
.ctitle{font-size:1.3rem;color:var(--sky-ink)}
.cdate{font-family:var(--display);font-size:1.35rem;line-height:1.4;color:var(--sky-ink)}
.cdate small,.cplace small,.cprice small{font-family:var(--body);font-size:.85rem;color:var(--muted)}
.cplace,.cprice{line-height:1.5}
[data-left]{color:var(--accent);font-weight:700}
.card form{display:grid;gap:6px;margin-top:6px;border-top:1px solid var(--line);padding-top:12px}
.card label{font-weight:500;font-size:.95rem;margin-top:6px}
.card label i{font-style:normal;font-size:.72rem;background:var(--accent);color:var(--on-accent);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.card input,.card select{font:inherit;font-size:1rem;padding:.6em .7em;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);width:100%;min-width:0}
.card input:focus-visible,.card select:focus-visible,.btn:focus-visible,.mbar:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card .row>div{display:grid;gap:6px;min-width:0}
.total{font-weight:700;color:var(--sky-ink);min-height:1.4em}
.opt{margin-top:4px}
.opt summary{font-size:.92rem}
.opt[open]{display:grid;gap:6px}
.err{color:var(--err);font-weight:500;min-height:1.2em}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.btn{border:0;cursor:pointer;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:700;font-size:1.1rem;padding:.85em 1.4em;border-radius:999px;min-height:54px;width:100%}
.btn:disabled{opacity:.6;cursor:wait}
.done{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;display:grid;gap:8px}
.done h3{font-size:1.25rem;color:var(--accent)}

/* スマホ下部の申込ボタン */
.mbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:block;text-align:center;background:var(--accent);color:var(--on-accent);font-weight:700;text-decoration:none;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (max-width:959px){body{padding-bottom:64px}}

footer{background:var(--night);color:var(--night-ink)}
footer .wrap{padding-block:36px 48px;display:grid;gap:10px}
footer h2{color:#fff;font-size:1.4rem}
footer .note{color:#a9b8ca}
.mail{user-select:all;font-family:var(--body)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

.release{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;color:var(--fg);text-decoration:none;line-height:1.6}
.release img{width:120px;height:120px;object-fit:cover;border-radius:4px}
.release span{min-width:0}
.release small{color:var(--muted)}
.release u{color:var(--accent);text-decoration:none;font-weight:500}
.release u::after{content:" →"}
@media (max-width:420px){.release{grid-template-columns:88px 1fr}.release img{width:88px;height:88px}}

.hist{list-style:none;padding:0;margin:0;display:grid}
.hist li{display:grid;grid-template-columns:8.5em 1fr;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);line-height:1.6}
.hist time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.92rem;padding-top:.1em}
.hist span{min-width:0}
.hist small{display:block;color:var(--muted);font-size:.85rem}
.hist .src{font-size:.8rem}
@media (max-width:480px){.hist li{grid-template-columns:1fr;gap:2px}}

.map{position:relative;width:100%;aspect-ratio:16/10;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.map.small{aspect-ratio:16/9}
.map iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.maplink{font-size:.9rem;font-weight:500}
.maplink::after{content:" ↗"}

.vids{display:grid;gap:20px}
.vids figure{margin:0;display:grid;gap:6px}
.yt{position:relative;width:100%;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#000}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

.subt{color:var(--muted);font-size:.95rem;margin-top:-8px}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px}
.tabs button{font:inherit;font-weight:700;font-size:.95rem;line-height:1.3;padding:8px 6px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer;display:grid;gap:2px;min-width:0}
.tabs button small{font-weight:400;font-size:.72rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tabs button[aria-selected="true"] small{color:var(--on-accent)}
.tabs button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{display:grid;gap:10px}
.flyers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.flyers img{border-radius:6px;border:1px solid var(--line);width:100%}

.knav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.knav .in{max-width:680px;margin:0 auto;padding-block:8px 0;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.knav .tt{text-align:center;font-weight:700;font-size:.9rem;color:var(--muted);margin:0 0 4px}
.knav nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.knav nav a{display:grid;justify-items:center;gap:2px;padding:6px 2px 8px;text-decoration:none;color:var(--muted);font-size:.9rem;font-weight:700;border-bottom:3px solid transparent}
.knav nav a span{font-size:1.35rem;line-height:1}
.knav nav a[aria-current]{color:var(--accent);border-bottom-color:var(--accent)}
.kw{max-width:680px;margin:0 auto;padding-block:16px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.kw h1{font-size:1.35rem;color:var(--sky-ink);margin:0} .lead{margin:0;color:var(--muted);font-size:.95rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;font:inherit;font-size:.95rem;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:8px 14px;cursor:pointer;text-align:left;line-height:1.35}
.chip small{display:block;color:var(--muted);font-size:.8rem}
.chip[aria-pressed=true]{border-color:var(--accent);background:var(--accent);color:#fff} .chip[aria-pressed=true] small{color:#fff;opacity:.85}
.card{gap:10px}

body{background:var(--bg)}
.kh{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center;font-weight:700;font-size:1.1rem;color:var(--sky-ink)}
.kh small{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
#log{max-width:680px;margin:0 auto;padding-block:16px 200px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.msg{display:flex} .msg.me{justify-content:flex-end}
.bub{max-width:85%;min-width:0;border-radius:16px;padding:10px 14px;display:grid;gap:8px;font-size:1.05rem;line-height:1.7;background:var(--card);border:1px solid var(--line);color:var(--fg)}
.me .bub{background:var(--accent);border-color:var(--accent);color:#fff;border-bottom-right-radius:4px} .bot .bub{border-bottom-left-radius:4px}
.bub p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.pics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px} .pics img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px}
.dots{color:var(--muted);font-size:.95rem} .dots::after{content:'…';animation:d 1.2s steps(3) infinite}
@keyframes d{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
.acts{display:flex;gap:8px;flex-wrap:wrap} .mini{font-size:.9rem;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:4px 14px;text-decoration:none}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.bar form{max-width:680px;margin:0 auto;display:grid;gap:8px}
.row{display:flex;gap:8px;align-items:flex-end}
.cam{flex:none;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;font-size:1.5rem;cursor:pointer}
.row textarea{flex:1;min-width:0;font:inherit;font-size:1.05rem;line-height:1.5;padding:11px 14px;border:1px solid var(--line);border-radius:22px;background:var(--bg);color:var(--fg);resize:none;height:48px;max-height:160px}
.snd{flex:none;height:48px;padding:0 18px;border:0;border-radius:24px;background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:1rem;cursor:pointer} .snd:disabled{opacity:.5}
#pend{display:flex;gap:8px;overflow-x:auto} .pt{position:relative;flex:none} .pt img{width:64px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.pt button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);font-size:.9rem;line-height:1;cursor:pointer}
#err{margin:0;color:#c0392b;font-size:.9rem} #err:empty{display:none}
</style></head><body>
<header class="knav"><div class="in"><p class="tt">田中純 公式サイト　管理</p><nav><a href="" aria-current=page><span aria-hidden="true">💬</span>更新</a><a href="add/"><span aria-hidden="true">➕</span>追加</a><a href="list/"><span aria-hidden="true">📋</span>申込</a><a href="annai/"><span aria-hidden="true">✉️</span>案内</a><a href="qr/"><span aria-hidden="true">🔳</span>QR</a></nav></div></header>
<main id="log" aria-live="polite"></main>
<div class="bar"><form id="f" novalidate>
<div id="pend" hidden></div><p id="err" role="alert"></p>
<div class="row"><label class="cam" for="pick" title="写真をえらぶ（6枚まで）" aria-label="写真をえらぶ">📷</label><input id="pick" type="file" accept="image/*" multiple hidden>
<textarea id="text" rows="1" placeholder="メッセージ" aria-label="メッセージ"></textarea>
<button id="send" class="snd" type="submit">送る</button></div>
</form></div>
<script>
const API="https://script.google.com/macros/s/AKfycbzPl1w1JAyU6xLUT_7telf8zuQ19KD5lrqHz3pSyuVvyUDRyDQlwvQb3o4VdbEpiZ6orQ/exec";const $=s=>document.querySelector(s);
let key='';try{key=(location.hash.slice(1))||localStorage.getItem('kanri_key')||'';if(location.hash.length>1){localStorage.setItem('kanri_key',key);history.replaceState(null,'',location.pathname)}}catch(e){key=location.hash.slice(1)}
let log=[];try{log=JSON.parse(localStorage.getItem('kanri_chat')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('kanri_chat',JSON.stringify(log.slice(-40)))}catch(e){}};
const files=[];const box=$('#log');
const HELLO='チラシの写真や、直したいことを送ってください。自動でサイトに反映します。';
function bubble(m){const w=document.createElement('div');w.className='msg '+(m.who==='me'?'me':'bot');const b=document.createElement('div');b.className='bub';
 if(m.thumbs&&m.thumbs.length){const g=document.createElement('div');g.className='pics';m.thumbs.forEach(t=>{const i=document.createElement('img');i.src=t;i.alt='送った写真';g.append(i)});b.append(g)}
 if(m.text){const p=document.createElement('p');p.textContent=m.text;b.append(p)}
 if(m.state==='wait'){const p=document.createElement('p');p.className='dots';p.textContent='読んで直しています（数分かかります）';b.append(p)}
 if(m.undo){const a=document.createElement('a');a.href=API+'?undo='+encodeURIComponent(m.job)+'&t='+encodeURIComponent(m.undo);a.target='_blank';a.rel='noopener';a.className='mini';a.textContent='元に戻す';const s=document.createElement('a');s.href='../';s.className='mini';s.textContent='サイトを見る';const r=document.createElement('div');r.className='acts';r.append(s,a);b.append(r)}
 w.append(b);return w}
function render(){box.innerHTML='';box.append(bubble({who:'bot',text:HELLO}));log.forEach(m=>box.append(bubble(m)));requestAnimationFrame(()=>window.scrollTo(0,document.body.scrollHeight))}
function thumb(file,max,q){return new Promise((ok,ng)=>{const img=new Image();img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};img.onerror=()=>ng(new Error('img'));img.src=URL.createObjectURL(file)})}
function showPending(){const p=$('#pend');p.innerHTML='';files.forEach((f,i)=>{const d=document.createElement('div');d.className='pt';const im=document.createElement('img');im.src=URL.createObjectURL(f);im.alt=(i+1)+'枚目';const x=document.createElement('button');x.type='button';x.textContent='×';x.setAttribute('aria-label',(i+1)+'枚目を外す');x.onclick=()=>{files.splice(i,1);showPending()};d.append(im,x);p.append(d)});p.hidden=!files.length}
$('#pick').addEventListener('change',e=>{for(const f of e.target.files)if(files.length<6)files.push(f);e.target.value='';showPending()});
const ta=$('#text');ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,160)+'px'});
function context(){const last=[...log].reverse().find(m=>m.who==='bot'&&m.job);if(!last||last.state!=='反映できず')return '';const me=log.find(m=>m.who==='me'&&m.job===last.job);
 return '（前のやりとり）\nお願い：'+((me&&me.text)||'（写真のみ）')+(me&&me.n?'（写真'+me.n+'枚）':'')+'\nサイト側の返事：'+last.text+'\n（今回の返事・追加の写真）\n'}
$('#f').addEventListener('submit',async e=>{e.preventDefault();const text=ta.value.trim();$('#err').textContent='';
 if(!key){$('#err').textContent='このページは、お知らせしたリンクから開いてください。';return}
 if(!text&&!files.length){ta.focus();return}
 const btn=$('#send');btn.disabled=true;
